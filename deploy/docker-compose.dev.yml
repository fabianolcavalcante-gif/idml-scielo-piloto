name: idml-development

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - idml_internal
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-app-environment: &app-environment
  IDML_ENVIRONMENT: ${IDML_ENVIRONMENT:-development}
  IDML_DATABASE_URL: postgresql+psycopg://${IDML_POSTGRES_USER}:${IDML_POSTGRES_PASSWORD}@postgres:5432/${IDML_POSTGRES_DB}
  IDML_REDIS_URL: redis://redis:6379/0
  IDML_ARTIFACT_ROOT: /var/lib/idml/artifacts
  IDML_SESSION_PEPPER: ${IDML_SESSION_PEPPER}
  IDML_MFA_ENCRYPTION_KEY: ${IDML_MFA_ENCRYPTION_KEY}
  IDML_LOG_LEVEL: ${IDML_LOG_LEVEL:-INFO}
  IDML_UPLOAD_MAX_BYTES: ${IDML_UPLOAD_MAX_BYTES:-104857600}
  IDML_ZIP_MAX_ENTRIES: ${IDML_ZIP_MAX_ENTRIES:-5000}
  IDML_ZIP_MAX_UNCOMPRESSED_BYTES: ${IDML_ZIP_MAX_UNCOMPRESSED_BYTES:-524288000}
  IDML_ZIP_MAX_RATIO: ${IDML_ZIP_MAX_RATIO:-100}
  IDML_ZIP_MAX_DEPTH: ${IDML_ZIP_MAX_DEPTH:-16}
  IDML_ZIP_MAX_PATH_BYTES: ${IDML_ZIP_MAX_PATH_BYTES:-512}
  IDML_SESSION_TTL_SECONDS: ${IDML_SESSION_TTL_SECONDS:-28800}
  IDML_FEATURE_OPENCLAW: "false"
  IDML_FEATURE_AI_SWARM: "false"
  IDML_OPENCLAW_GATEWAY_URL: ${IDML_OPENCLAW_GATEWAY_URL:-http://openclaw-idml:47716}
  IDML_OPENCLAW_GATEWAY_TOKEN: ${IDML_OPENCLAW_GATEWAY_TOKEN:-}
  IDML_AI_TIMEOUT_SECONDS: ${IDML_AI_TIMEOUT_SECONDS:-45}
  IDML_AI_MAX_ATTEMPTS: ${IDML_AI_MAX_ATTEMPTS:-2}
  IDML_AI_MAX_INPUT_TOKENS: ${IDML_AI_MAX_INPUT_TOKENS:-12000}
  IDML_AI_MAX_OUTPUT_TOKENS: ${IDML_AI_MAX_OUTPUT_TOKENS:-2000}
  IDML_AI_MAX_COST_MICROUSD: ${IDML_AI_MAX_COST_MICROUSD:-50000}
  IDML_AI_MAX_CONCURRENCY: "1"
  IDML_AI_CONFIDENCE_THRESHOLD: ${IDML_AI_CONFIDENCE_THRESHOLD:-0.85}
  IDML_AI_MAX_REPAIR_CYCLES: ${IDML_AI_MAX_REPAIR_CYCLES:-2}
  IDML_FEATURE_CLAMAV: ${IDML_FEATURE_CLAMAV:-false}
  IDML_CLAMAV_HOST: ${IDML_CLAMAV_HOST:-clamav}
  IDML_CLAMAV_PORT: ${IDML_CLAMAV_PORT:-3310}

services:
  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: ${IDML_POSTGRES_DB}
      POSTGRES_USER: ${IDML_POSTGRES_USER}
      POSTGRES_PASSWORD: ${IDML_POSTGRES_PASSWORD}
    volumes:
      - idml_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 120

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - idml_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 96m
    cpus: 0.20
    pids_limit: 80

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: idml-foundation:${IDML_IMAGE_TAG:-development}
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - idml_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100

  artifacts-init:
    image: alpine:3.21
    user: "0:0"
    command: ["sh", "-c", "chown 10001:10001 /artifacts && chmod 0750 /artifacts"]
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    volumes:
      - idml_artifacts:/artifacts
    restart: "no"
    mem_limit: 32m
    cpus: 0.05
    pids_limit: 20

  openclaw-config-init:
    image: alpine:3.21
    user: "0:0"
    command:
      - sh
      - -ec
      - >-
        mkdir -p /state/workspace &&
        cp /seed/openclaw.json /state/openclaw.json &&
        cp -a /seed/workspace/. /state/workspace/ &&
        chown -R 1000:1000 /state &&
        chmod 0700 /state /state/workspace &&
        chmod 0600 /state/openclaw.json
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - idml_openclaw_state:/state
      - ../config/openclaw-idml-dedicated.json:/seed/openclaw.json:ro
      - ../openclaw/idml-evaluator-workspace:/seed/workspace:ro
    restart: "no"
    mem_limit: 32m
    cpus: 0.05
    pids_limit: 20

  openclaw-idml:
    image: ghcr.io/openclaw/openclaw@sha256:3814fb1f62f9cfc5944de088c5817c68c88b5d721feebe36420b666a90a61ce7
    user: "1000:1000"
    command: ["node", "openclaw.mjs", "gateway", "run"]
    environment:
      HOME: /home/node
      NODE_ENV: production
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${IDML_OPENCLAW_GATEWAY_TOKEN:?define a dedicated IDML OpenClaw token}
      OPENCLAW_DISABLE_BONJOUR: "1"
    volumes:
      - idml_openclaw_state:/home/node/.openclaw
    networks:
      - idml_openclaw
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:47716/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      openclaw-config-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.35
    pids_limit: 120

  api:
    <<: *service-defaults
    image: idml-foundation:${IDML_IMAGE_TAG:-development}
    environment: *app-environment
    ports:
      - "127.0.0.1:${IDML_API_PORT:-18080}:8000"
    networks:
      - idml_internal
      - idml_loopback
      - idml_openclaw
    volumes:
      - idml_artifacts:/var/lib/idml/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      artifacts-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 120

  worker:
    <<: *service-defaults
    image: idml-foundation:${IDML_IMAGE_TAG:-development}
    environment: *app-environment
    command: ["python", "-m", "idml_foundation.worker"]
    volumes:
      - idml_artifacts:/var/lib/idml/artifacts
    networks:
      - idml_internal
      - idml_openclaw
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      artifacts-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 120

networks:
  idml_internal:
    name: idml_development_internal
    internal: true
  idml_loopback:
    name: idml_development_loopback
  idml_openclaw:
    name: idml_development_openclaw
    internal: true

volumes:
  idml_postgres_data:
    name: idml_development_postgres
  idml_redis_data:
    name: idml_development_redis
  idml_artifacts:
    name: idml_development_artifacts
  idml_openclaw_state:
    name: idml_development_openclaw_state
