[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "idml-foundation"
version = "0.1.0"
description = "Fundação segura e multiempresa da plataforma IDML para SciELO"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=45,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "lxml>=5.3,<7",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6.1,<7",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "lxml-stubs>=0.5,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
idml-admin = "idml_foundation.cli:main"
idml-worker = "idml_foundation.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --cov=idml_foundation --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL and Redis",
  "security: security regression",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["idml_foundation"]

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
